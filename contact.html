    <main>
    <section class="page-title wrap">
      <h1>Contact me</h1>

    <section class="section">
      <div class="wrap split">
        <div class="photo" role="img" aria-label="Fidel Castrol workspace" style="--img:url('https://images.unsplash.com/photo-1423666639041-f56000c27a9a?auto=format&fit=crop&w=800&q=80')"></div>
        <div class="stack">
          <p>Send a message and I'll reply within two working days. You can also email <a href="mailto:fidelcastrolok@gmail.com">fidelcastrolok@gmail.com</a>.</p>
          <!-- Swap the action for your form service (Formspree, Netlify Forms, etc.) when you go live -->
          <form class="form" action="mailto:fidelcastrolok@gmail.com" method="post" enctype="text/plain">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button class="btn btn-solid" type="submit">Send message</button>
          </form>
        </div>
      </div>
    </section>
