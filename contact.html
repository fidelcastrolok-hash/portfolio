<html lang="en">

    <title>Portfolio</title>
    <style>
      .logo{
    width: 100px;
    height: 100px;
}

nav{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: #efe9dc;
    border-radius: 20px; 
}

nav ul{
    list-style: none;
    display: flex;
    margin: 0;
    padding: 20px;
}

nav li{
    text-decoration: none;
    color: #333;
    font-size: 18px;
    font-family:Georgia, 'Times New Roman', Times, serif;
    margin: 0 5px;
    display:flex;
    justify-content: center;
    text-align: center;
}

nav li a{
    text-decoration: none;
    color: #333;
    font-size: 18px;
    font-family:Georgia, 'Times New Roman', Times, serif;
    margin: 0 10px;
    display:flex;
    justify-content: center;
    text-align: center;
}

nav li a:hover{
    color: #fff;
    background-color: #333;
    border-radius: 30px;
    padding: 5px 10px;
    transition: all 0.3s ease-in-out;
}



/* ---------- Tokens ---------- */
:root{
  --bg:#efe9dc;
  --ink:#000;
  --muted:#4a463e;
  --card:#e4dccb;
  --line:rgba(0,0,0,.2);
  --radius:20px;
  --max:1120px;
  --nav-h:72px;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1;letter-spacing:-.02em}
h1{font-size:clamp(2.5rem,6vw,4.75rem)}
h2{font-size:clamp(1.9rem,4vw,3rem)}
h3{font-size:1.35rem}
p{max-width:62ch}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{width:min(var(--max),100% - 2.5rem);margin-inline:auto}
.section{padding-block:clamp(4rem,9vw,7rem)}
.stack > * + *{margin-top:1.25rem}
.muted{color:var(--muted)}

/* ---------- Navbar ---------- */
.site-header{position:sticky;top:0;z-index:10;background:rgba(239,233,220,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:var(--nav-h)}
.logo{font-family:var(--serif);font-size:1.45rem;font-weight:600;text-decoration:none;letter-spacing:-.02em}
.nav-list{display:flex;gap:2.25rem;list-style:none;padding:0}
.nav-list a{text-decoration:none;padding-block:.25rem;border-bottom:1px solid transparent;transition:border-color .2s}
.nav-list a:hover,.nav-list a[aria-current="page"]{border-color:var(--ink)}
#nav-toggle{position:absolute;opacity:0;pointer-events:none}
.menu-btn{display:none;cursor:pointer;padding:.4rem 1rem;border:1px solid var(--ink);border-radius:999px;font-size:.95rem}
#nav-toggle:focus-visible + .menu-btn{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- Buttons ---------- */
.btn{display:inline-block;padding:.85rem 1.7rem;border:1px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:500;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-weight:500;transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn-solid{background:var(--ink);color:var(--bg)}
.btn-solid:hover{background:transparent;color:var(--ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2rem}

/* ---------- Image slots (set --img inline to use a real photo) ---------- */
.photo,.portrait{background:var(--img,none) center/cover no-repeat,var(--card);border:1px solid var(--line)}
.photo{aspect-ratio:4/5;border-radius:var(--radius);width:100%}
.portrait{aspect-ratio:1;border-radius:50%;width:min(100%,420px);justify-self:center;border-color:var(--ink)}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(90deg,var(--bg) 30%,rgba(239,233,220,.55)),var(--img,none) center/cover no-repeat,var(--bg)}
.hero-inner{display:grid;grid-template-columns:1.35fr .85fr;align-items:center;gap:3rem;min-height:calc(100svh - var(--nav-h));padding-block:4rem}
.hero p{font-size:1.2rem;margin-top:1.5rem}

/* ---------- Layout helpers ---------- */
.split{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(2rem,6vw,5rem);align-items:center}
.page-title{padding-top:clamp(3rem,7vw,5.5rem)}
.rows{list-style:none;padding:0;margin-top:2rem;border-top:1px solid var(--line)}
.rows li{display:flex;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.rows span:last-child{color:var(--muted);text-align:right}
.cta{border-top:1px solid var(--line);text-align:center}
.cta p{margin-inline:auto}

/* ---------- Form ---------- */
.form{display:grid;gap:1.5rem}
.field{display:grid;gap:.35rem}
.field label{font-weight:500}
.field input,.field textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);padding:.6rem 0;border-radius:0;resize:vertical}
.field input:focus,.field textarea:focus{outline:0;border-bottom-width:2px;padding-bottom:calc(.6rem - 1px)}
.form .btn{justify-self:start}

/* ---------- Footer ---------- */
.site-footer{border-top:1px solid var(--line);padding-block:2.5rem}
.footer-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5rem}
.to-top{display:grid;place-items:center;width:52px;height:52px;border:1px solid var(--ink);border-radius:50%;text-decoration:none;transition:background .2s,color .2s}
.to-top:hover{background:var(--ink);color:var(--bg)}
.socials{display:flex;gap:1.1rem;justify-content:flex-end;list-style:none;padding:0}
.socials a{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;transition:border-color .2s}
.socials a:hover{border-color:var(--ink)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Responsive ---------- */
@media (max-width:860px){
  .hero-inner,.split{grid-template-columns:1fr}
  .hero-inner{min-height:auto;gap:2.5rem}
  .portrait{order:-1;width:min(70%,300px);justify-self:start}
  .photo{aspect-ratio:4/3;max-height:420px}
}
@media (max-width:720px){
  .menu-btn{display:block}
  .nav-list{display:none;position:absolute;top:var(--nav-h);left:0;right:0;flex-direction:column;gap:1rem;padding:1.25rem 1.25rem 1.75rem;background:var(--bg);border-bottom:1px solid var(--line)}
  #nav-toggle:checked ~ .nav-list{display:flex}
  .footer-grid{grid-template-columns:1fr;justify-items:center;text-align:center}
  .socials{justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
}
